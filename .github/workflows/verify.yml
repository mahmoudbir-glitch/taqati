name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://taqati:taqati@localhost:5432/taqati?schema=public
      MQTT_URL: mqtt://localhost:1883
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: taqati
          POSTGRES_PASSWORD: taqati
          POSTGRES_DB: taqati
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taqati -d taqati"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:migrate:diff
      - run: test -s packages/database/prisma/migrations/0_init/migration.sql
      - run: pnpm --filter @taqati/database exec prisma db push --config prisma.config.ts --accept-data-loss
      - run: pnpm typecheck
      - run: node apps/web/scripts/sync-smartess.mjs --check
      - run: pnpm test
      - run: pnpm build
